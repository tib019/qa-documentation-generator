# Azure DevOps Pipeline: Geplante QA-Dokumenten-Generierung
# Läuft automatisch zu festgelegten Zeiten

trigger: none

schedules:
  - cron: "0 8 * * 1-5"  # Montag bis Freitag um 8:00 Uhr
    displayName: 'Daily Morning Generation'
    branches:
      include:
        - main
    always: false  # Nur bei Änderungen

pool:
  vmImage: 'windows-latest'

variables:
  outputPath: '$(Build.ArtifactStagingDirectory)/scheduled-docs'
  emailRecipients: 'qa-team@hosenso.com'  # Anpassen!

jobs:
  - job: ScheduledGeneration
    displayName: 'Scheduled Document Generation'
    steps:
      - checkout: self
        displayName: 'Checkout Repository'

      - task: PowerShell@2
        displayName: 'Setup Environment'
        inputs:
          targetType: 'inline'
          script: |
            Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope Process -Force
            New-Item -ItemType Directory -Force -Path "$(outputPath)"
            Write-Host "Scheduled generation started at $(Get-Date)"

      - task: PowerShell@2
        displayName: 'Check for New/Modified JSON Files'
        inputs:
          targetType: 'inline'
          script: |
            # Prüfe auf neue oder geänderte JSON-Dateien in den letzten 24 Stunden
            $cutoffDate = (Get-Date).AddHours(-24)
            $recentFiles = Get-ChildItem -Path "data","examples" -Filter "*.json" -Recurse -ErrorAction SilentlyContinue | 
                           Where-Object { $_.LastWriteTime -gt $cutoffDate }
            
            if ($recentFiles.Count -eq 0) {
              Write-Host "No new or modified JSON files found in the last 24 hours"
              Write-Host "##vso[task.setvariable variable=hasNewFiles]false"
            } else {
              Write-Host "Found $($recentFiles.Count) new/modified JSON files:"
              $recentFiles | ForEach-Object { Write-Host "  - $($_.Name)" }
              Write-Host "##vso[task.setvariable variable=hasNewFiles]true"
            }

      - task: PowerShell@2
        displayName: 'Generate Documents from Recent Files'
        condition: eq(variables['hasNewFiles'], 'true')
        inputs:
          targetType: 'inline'
          script: |
            $cutoffDate = (Get-Date).AddHours(-24)
            $recentFiles = Get-ChildItem -Path "data","examples" -Filter "*.json" -Recurse -ErrorAction SilentlyContinue | 
                           Where-Object { $_.LastWriteTime -gt $cutoffDate }
            
            foreach ($file in $recentFiles) {
              Write-Host "Processing: $($file.Name)"
              
              # Bestimme Template basierend auf Dateinamen
              $template = "BugTicket"
              if ($file.Name -match "test") { $template = "TestProtokoll" }
              if ($file.Name -match "solution") { $template = "SolutionConcept" }
              
              try {
                .\Generate-QADocument.ps1 -ConfigFile $file.FullName -Template $template -OutputPath "$(outputPath)\$($file.BaseName).md"
                Write-Host "✓ Generated: $($file.BaseName).md"
              } catch {
                Write-Host "✗ Error: $_"
              }
            }

      - task: PowerShell@2
        displayName: 'Generate Daily Report'
        condition: eq(variables['hasNewFiles'], 'true')
        inputs:
          targetType: 'inline'
          script: |
            $generatedFiles = Get-ChildItem -Path "$(outputPath)" -Filter "*.md"
            
            $report = @"
            # Daily QA Documentation Report
            
            **Date:** $(Get-Date -Format "yyyy-MM-dd")
            **Build:** $(Build.BuildNumber)
            **Generated by:** Scheduled Pipeline
            
            ## Summary
            
            - Documents generated: $($generatedFiles.Count)
            - Total size: $([math]::Round(($generatedFiles | Measure-Object -Property Length -Sum).Sum / 1KB, 2)) KB
            
            ## Generated Documents
            
            | Document | Size | Generated At |
            |----------|------|--------------|
            "@
            
            foreach ($file in $generatedFiles) {
              $report += "`n| $($file.Name) | $([math]::Round($file.Length / 1KB, 2)) KB | $(Get-Date -Format 'HH:mm:ss') |"
            }
            
            $report += @"
            
            
            ## Next Steps
            
            - Review generated documents in build artifacts
            - Upload to Azure DevOps Wiki if needed
            - Archive or distribute as required
            
            ---
            
            *This report was automatically generated by the QA Documentation Generator*
            "@
            
            $report | Out-File -FilePath "$(outputPath)\DAILY_REPORT.md" -Encoding UTF8
            Write-Host $report

      - task: PublishBuildArtifacts@1
        displayName: 'Publish Generated Documents'
        condition: eq(variables['hasNewFiles'], 'true')
        inputs:
          PathtoPublish: '$(outputPath)'
          ArtifactName: 'scheduled-qa-documentation'
          publishLocation: 'Container'

      - task: PowerShell@2
        displayName: 'Send Email Notification (Optional)'
        condition: eq(variables['hasNewFiles'], 'true')
        inputs:
          targetType: 'inline'
          script: |
            Write-Host "Email notification would be sent to: $(emailRecipients)"
            Write-Host "Note: Configure email task in Azure DevOps for actual notifications"
            # Beispiel: Verwende 'Send Email' Task aus Marketplace
